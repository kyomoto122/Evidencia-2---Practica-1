<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de IMC</title>
</head>
<body>

  <h1>Calculadora de IMC</h1>

  <label for="peso">Peso en kg</label>
  <input type="text" id="peso" placeholder="70"><br>

  <label for="altura">Altura en metros</label>
  <input type="text" id="altura" placeholder="1.80"><br>

  <label for="imc">IMC</label>
  <input type="text" id="imc"><br>

  <label for="resultado">Conclusion</label>
  <input type="text" id="resultado"><br>

  <button id="btnCalcular">Calcular</button>
  <button id="btnLimpiar">Limpiar</button>

  <div class="clasificaciones">
  <p>Bajo peso:18.5</p>
  <p>Peso normal: 18.5 a 25</p>
  <p>Sin clasificación</p>
  </div>

  <script src="calculadora.js"></script>
</body>
</html>
